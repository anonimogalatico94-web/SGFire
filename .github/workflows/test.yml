name: SGFire Android APK - A03 compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -eux
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;35.0.1"

      - name: Install Godot 4.4.1
        run: |
          set -eux
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Android templates
        run: |
          set -eux
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot paths
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/java_sdk_path = "$JAVA_HOME"
EOF

      - name: Configure debug signing
        run: |
          set -eux
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate Godot project
        run: |
          set -eux
          test -f project.godot
          test -f export_presets.cfg
          test -f A03Diagnostic.tscn
          godot --headless --editor --quit --path .

      - name: Export A03 APK
        run: |
          set -eux
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SGFire-A03.apk
          test -s build/SGFire-A03.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose build/SGFire-A03.apk

      - name: Upload SGFire A03 APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-A03-APK
          path: build/SGFire-A03.apk
          retention-days: 14
