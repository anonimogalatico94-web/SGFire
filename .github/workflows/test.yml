name: SGFire Android APK - Android 9+ playtest 180

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.4.1
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/35.0.1/aapt" version
      - name: Install Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Install matching Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .github/android/sgfire-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f Prototype.tscn
          test -f prototype.gd
          mkdir -p build
          godot --headless --editor --quit --path . 2>&1 | tee build/editor-validation.log
          if grep -E "SCRIPT ERROR|Parse Error" build/editor-validation.log; then
            echo "Godot reported a script parse/runtime error during project validation."
            exit 1
          fi
      - name: Smoke-test actual startup scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee build/runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error" build/runtime-smoke.log; then
            echo "The startup scene reported a script error."
            exit 1
          fi
          echo "Startup scene ran for 120 frames without a GDScript error."
      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/export
          mkdir -p build/export
          godot --headless --path . --export-debug "Android" build/export/SGFire-Android9Plus-180.apk
          test -s build/export/SGFire-Android9Plus-180.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 4 -v 4 build/export/SGFire-Android9Plus-180.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/export/SGFire-Android9Plus-180.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/export/SGFire-Android9Plus-180.apk | tee build/export/apk-badging.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-Android9Plus-APK-180
          path: |
            build/export/SGFire-Android9Plus-180.apk
            build/export/apk-badging.txt
            build/runtime-smoke.log
          if-no-files-found: error
          retention-days: 14
