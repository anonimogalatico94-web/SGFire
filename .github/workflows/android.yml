name: SGFire Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android build environment
        shell: bash
        run: |
          set -eux
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q --show-progress -O /tmp/Godot_v4.4.1-stable_export_templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -o /tmp/Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          if [ -d /tmp/godot_templates/templates ]; then
            cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            find /tmp/godot_templates -type f -name 'android_debug.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;
            find /tmp/godot_templates -type f -name 'android_release.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;
            find /tmp/godot_templates -type f -name 'android_source.zip' -exec cp {} "$HOME/.local/share/godot/export_templates/4.4.1.stable/" \;
          fi
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
EOF

      - name: Validate project
        run: godot --headless --import --quit-after 1

      - name: Export Android APK
        run: |
          set -eux
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/SGFire-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-Android-debug
          path: build/SGFire-debug.apk
          if-no-files-found: error
