name: SGFire Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --import --quit-after 1 || true

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/SGFire-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-Android-debug
          path: build/SGFire-debug.apk
          if-no-files-found: error
