name: SGFire Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses || true

      - name: Install Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Verify Godot project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f SafeBoot.tscn
          test -f safeboot.gd
          godot --headless --editor --quit --path . --verbose

      - name: Export SGFire APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SGFire.apk

      - name: Verify APK
        run: |
          test -s build/SGFire.apk
          ls -lh build/SGFire.apk
          unzip -l build/SGFire.apk | grep -E "AndroidManifest.xml|lib/armeabi-v7a|lib/arm64-v8a"

      - name: Upload SGFire APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-APK
          path: build/SGFire.apk
          if-no-files-found: error
          retention-days: 14
