name: SGFire Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar SGFire
        uses: actions/checkout@v4

      - name: Configurar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Exportar Android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SGFire.apk
                  - name: Enviar APK
          uses: actions/upload-artifact@v4
          with:
            name: SGFire-APK
            path: build/SGFire.apk
