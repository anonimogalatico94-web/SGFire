name: SGFire Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SGFire
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          set -eux
          uname -a
          java -version
          test -f project.godot

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"

      - name: Install Godot 4.4.1
        run: |
          set -eux
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Android templates
        run: |
          set -eux
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Android signing
        run: |
          set -eux
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Validate project
        run: |
          set -eux
          godot --headless --editor --quit --path .

      - name: Export SGFire APK
        run: |
          set -eux
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SGFire.apk
          test -s build/SGFire.apk
          file build/SGFire.apk

      - name: Upload SGFire APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-APK
          path: build/SGFire.apk
          retention-days: 14
