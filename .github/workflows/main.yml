name: SGFire Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar SGFire
        uses: actions/checkout@v4

      - name: Configurar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validar projeto
        run: godot --headless --path . --import --quit-after 1

      - name: Exportar Android
        run: |
          set -eux
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SGFire.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: SGFire-APK
          path: build/SGFire.apk
          if-no-files-found: error
